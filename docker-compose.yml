services:
  mongodb:
    image: mongo:8.0
    container_name: shopanalytics-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: shopanalytics-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      MONGO_URI: ${MONGO_URI_DOCKER}
    depends_on:
      - mongodb

volumes:
  mongodb_data:
